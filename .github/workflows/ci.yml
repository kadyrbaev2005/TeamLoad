name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamload
          POSTGRES_PASSWORD: teamload
          POSTGRES_DB: teamload_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamload" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://teamload:teamload@localhost:5432/teamload_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build
