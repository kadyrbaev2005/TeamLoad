<title>TeamLoad Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#ECEEEA; --ink:#18202E; --muted:#5B6474; --line:#DADDD6;
  --accent:#2F4BD8; --accent-ink:#FFFFFF; --accent-soft:#E4E8FB;
  --ok:#1E7F4F; --ok-soft:#DDF1E5; --warn:#9A6200; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#F8DCD9;
  --r1:#2F4BD8; --r2:#0F8B7D; --r3:#C2410C; --r4:#9333EA; --r5:#A16207; --r6:#BE185D;
  --shadow:0 1px 2px rgba(24,32,46,.06),0 4px 16px rgba(24,32,46,.06); --av-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10141C; --surface:#171C26; --surface-2:#1F2531; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2C3342;
  --accent:#8196FF; --accent-ink:#0E1330; --accent-soft:#232B52;
  --ok:#5CC98E; --ok-soft:#173424; --warn:#F0B24A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#3E1D1B;
  --r1:#8196FF; --r2:#3CC7B5; --r3:#FB8A5A; --r4:#C084FC; --r5:#E3B341; --r6:#F472B6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --av-ink:#10141C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141C; --surface:#171C26; --surface-2:#1F2531; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2C3342;
  --accent:#8196FF; --accent-ink:#0E1330; --accent-soft:#232B52;
  --ok:#5CC98E; --ok-soft:#173424; --warn:#F0B24A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#3E1D1B;
  --r1:#8196FF; --r2:#3CC7B5; --r3:#FB8A5A; --r4:#C084FC; --r5:#E3B341; --r6:#F472B6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --av-ink:#10141C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 16px;background:#0B0F16;color:#E7EAF0;font-size:13px}
.proto b{font-family:var(--f-mono);letter-spacing:.04em}
.proto label{display:flex;align-items:center;gap:8px}
.proto select{background:transparent;color:#E7EAF0;border:1px solid rgba(231,234,240,.4);border-radius:6px;padding:3px 6px}
.proto select option{color:#18202E;background:#fff}
.proto .sp{flex:1}
.proto button{background:transparent;border:1px solid rgba(231,234,240,.4);color:#E7EAF0;border-radius:6px;padding:3px 10px;cursor:pointer}

/* app shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:0 6px}
.brand svg{flex:none}
.projpick{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.projpick b{font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);padding-top:14px}
.main{padding-block:28px 60px;padding-inline:clamp(16px,4vw,40px);min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .t{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}

/* components */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ai{background:var(--accent-soft);color:var(--accent)}
.chip.line{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--av-ink);flex:none;font-family:var(--f-body)}
.avatar.lg{width:40px;height:40px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.input,.textarea,.select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px}
.textarea{min-height:110px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.counter{font-size:12px;color:var(--muted);text-align:right}
.counter.bad{color:var(--bad)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--ink)} .notice.warn svg{color:var(--warn)}
.notice.ai{background:var(--accent-soft)} .notice.ai svg{color:var(--accent)}
.notice.bad{background:var(--bad-soft)} .notice.bad svg{color:var(--bad)}
.notice svg{flex:none;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(420px,100%)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.steps{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px}
.steps li{list-style:none;display:flex;gap:8px;align-items:center;color:var(--muted)}
.steps li.done{color:var(--ink)}
.steps ul{margin:0;padding:0}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-side{background:var(--ink);color:var(--bg);padding:48px clamp(16px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-side h1{font-size:clamp(30px,4vw,44px);color:var(--bg)}
.auth-side .brand{padding:0;color:var(--bg)}
.flowline{display:flex;flex-direction:column;gap:14px;max-width:420px}
.flowline div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.flowline .n{font-family:var(--f-mono);font-size:12px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:6px;display:grid;place-items:center;height:24px}
.flowline p{color:color-mix(in srgb,var(--bg) 78%,transparent)}
.flowline b{color:var(--bg)}
.auth-form{display:grid;place-items:center;padding:40px 16px}
.auth-form form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent)}

/* projects list */
.projcard{display:flex;flex-direction:column;gap:12px;padding:18px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left}
.projcard:hover{border-color:var(--accent)}
.avstack{display:flex}
.avstack .avatar{border:2px solid var(--surface);margin-left:-8px}
.avstack .avatar:first-child{margin-left:0}
.newcard{border-style:dashed;display:grid;place-items:center;min-height:170px;color:var(--muted);font-weight:600;background:transparent}

/* new project */
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;width:max-content;background:var(--surface)}
.stepper button{border:0;background:transparent;width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-mono);font-weight:700}
.seats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.seat{width:26px;height:26px;border-radius:7px;border:1.5px dashed var(--line)}
.seat.you{border:0;background:var(--accent)}
.goodlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* plan */
.effort{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.effort span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.slot{display:flex;flex-direction:column;gap:12px;padding:18px;position:relative}
.slot .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.slot .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slot h3{font-size:18px}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.slot ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.why{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.why b{color:var(--ink);font-weight:600}
.share{display:flex;align-items:center;gap:8px}
.share input{width:64px;text-align:right;font-family:var(--f-mono);padding:4px 8px}
.editable[contenteditable="true"]{outline:1px dashed var(--accent);outline-offset:3px;border-radius:4px}
.invite{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:22px;font-weight:700;letter-spacing:.12em;padding:6px 12px;border-radius:9px;background:var(--surface-2)}
.statusline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* roles */
.ready{display:flex;flex-direction:column}
.ready > div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ready > div:last-child{border-bottom:0}
.match{display:grid;grid-template-columns:minmax(170px,1fr) minmax(200px,1.2fr) minmax(0,2.4fr) auto;gap:18px;align-items:start;padding:18px 20px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .slotname{display:flex;gap:10px;align-items:flex-start}
.match .slotname b{display:block;font-family:var(--f-display);font-size:16px}
.fit{display:flex;flex-direction:column;gap:6px}
.fitbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.fitbar i{display:block;height:100%;background:var(--accent)}
.match > *{min-width:0}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);flex:1;min-width:0;width:100%}
.expl{font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl q{quotes:"\201C" "\201D"}
.src{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* raci */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.raci{border-collapse:collapse;width:100%;min-width:760px}
.raci th,.raci td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:center;vertical-align:middle}
.raci thead th{font-size:13px;font-weight:600;background:var(--surface-2);position:sticky;top:0}
.raci th.act,.raci td.act{text-align:left}
.raci td.act{font-weight:500}
.raci tr:last-child td{border-bottom:0}
.raci .colhead{display:flex;flex-direction:column;align-items:center;gap:3px}
.raci .colhead small{color:var(--muted);font-weight:500}
.cell{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-weight:700;cursor:pointer}
.cell:hover{border-color:var(--accent)}
.cell.R{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.A{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cell.C{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cell.I{background:var(--surface-2);color:var(--muted);border-color:transparent}
.rkey{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
.rkey span{display:inline-flex;gap:8px;align-items:center}
.rkey .cell{width:26px;height:24px;cursor:default;font-size:12px}

/* board */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;font-weight:600}
.filters button.all{padding:4px 12px}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.filters .avatar{width:22px;height:22px;font-size:10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.colhead h3{font-size:15px;display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card.dragging{opacity:.5}
.card .t{font-weight:600;font-size:14.5px}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .by{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.card .by span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .by .avatar{width:24px;height:24px;font-size:10px}
.hrs{font-family:var(--f-mono);font-size:12.5px;font-weight:700;background:var(--surface-2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.card.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.unassigned{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--muted);flex:none}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.chart svg{width:100%;height:auto;display:block}
table.load{border-collapse:collapse;width:100%;min-width:640px}
.load th,.load td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.load th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.load td.n,.load th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.load tr:last-child td{border-bottom:0}
.sharebar{display:flex;align-items:center;gap:8px}
.sharebar .b{flex:1;height:6px;border-radius:3px;background:var(--surface-2);position:relative;min-width:60px}
.sharebar .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--muted)}
.sharebar .b em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}

/* profile */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--surface)}
.tagbox input{border:0;outline:0;flex:1;min-width:120px;padding:4px 6px;background:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 4px 3px 9px;font-size:13px;font-weight:600}
.tag button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}

/* join */
.joinwrap{display:grid;place-items:center;padding:48px 16px;min-height:100vh}
.joincard{width:min(520px,100%);padding:28px;display:flex;flex-direction:column;gap:18px}

/* members */
.memberrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.memberrow:last-child{border-bottom:0}
.memberrow .nm{flex:1;min-width:160px}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}

function daysLeft(){ const d=new Date(S.project.deadline+"T00:00:00"); return Math.max(0,Math.round((d-TODAY)/864e5)); }
function fmtDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function assignedSlotOf(mid){ const r=S.matching.rows.find(r=>r.member===mid); return r?slot(r.slot):null; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function copyText(txt){ try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied: "+txt),()=>toast("Copy this: "+txt)); }catch(e){ toast("Copy this: "+txt); } }

function loadData(){
  const rows=S.members.map(m=>{
    const mine=S.tasks.filter(t=>t.m===m.id);
    const active=mine.filter(t=>t.st!=="done").reduce((a,t)=>a+t.h,0);
    const done=mine.filter(t=>t.st==="done").reduce((a,t)=>a+t.h,0);
    return {m,active,done,n:mine.filter(t=>t.st!=="done").length,slot:assignedSlotOf(m.id)};
  });
  const total=rows.reduce((a,r)=>a+r.active,0), avg=total/rows.length;
  rows.forEach(r=>{ r.status = avg===0?"Balanced": r.active>1.25*avg?"Overloaded": r.active<0.75*avg?"Underloaded":"Balanced"; });
  const unassigned=S.tasks.filter(t=>!t.m&&t.st!=="done").reduce((a,t)=>a+t.h,0);
  return {rows,total,avg,unassigned};
}
function statusChip(s){ return s==="Overloaded"?`<span class="chip bad"><span class="dot"></span>Overloaded</span>`:s==="Underloaded"?`<span class="chip warn"><span class="dot"></span>Underloaded</span>`:`<span class="chip ok"><span class="dot"></span>Balanced</span>`; }
function vDash(){
  const D=loadData(), over=D.rows.filter(r=>r.status==="Overloaded"), under=D.rows.filter(r=>r.status==="Underloaded");
  // chart
  const W=720,H=300,L=44,Rr=16,T=20,B=48, iw=W-L-Rr, ih=H-T-B;
  const maxV=Math.max(...D.rows.map(r=>r.active), D.avg*1.25, 1);
  const top=Math.ceil(maxV/10)*10; const y=v=>T+ih-(v/top)*ih;
  const bw=iw/D.rows.length;
  const ticks=[]; for(let v=0;v<=top;v+=top/5) ticks.push(v);
  const fill=s=>s==="Overloaded"?"var(--bad)":s==="Underloaded"?"var(--warn)":"var(--ok)";
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Active hours per member compared to the team average">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtH(v)}</text>`).join("")}
    <rect x="${L}" y="${y(D.avg*1.25)}" width="${iw}" height="${y(D.avg*0.75)-y(D.avg*1.25)}" fill="var(--ok)" opacity=".08"/>
    ${D.rows.map((r,i)=>{const x=L+i*bw+bw*0.22, w=bw*0.56, yy=y(r.active);
      return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,T+ih-yy)}" rx="5" fill="${fill(r.status)}"/>
      <text x="${x+w/2}" y="${yy-7}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono,monospace">${fmtH(r.active)} h</text>
      <text x="${x+w/2}" y="${H-B+20}" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">${esc(r.m.short)}</text>
      <text x="${x+w/2}" y="${H-B+36}" text-anchor="middle" font-size="11" fill="var(--muted)">${r.status}</text>`;}).join("")}
    <line x1="${L}" x2="${W-Rr}" y1="${y(D.avg)}" y2="${y(D.avg)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
  </svg>`;
  const allH=S.tasks.reduce((a,t)=>a+t.h,0)||1;
  return shell("dashboard", head("Dashboard","Workload",`Active load = hours in To do + Doing. Balanced band is 75–125% of the team average.`,`<a class="btn" href="#board">${I.board}Open board</a>`)+`
  <div class="stack" style="gap:18px">
    <div class="kpis">
      <div class="panel kpi"><span class="eyebrow">Days to deadline</span><span class="v">${daysLeft()}</span><span class="small muted">${fmtDate(S.project.deadline)}</span></div>
      <div class="panel kpi"><span class="eyebrow">Active hours</span><span class="v">${fmtH(D.total)}<small>h</small></span><span class="small muted">${S.tasks.filter(t=>t.st!=="done").length} open tasks</span></div>
      <div class="panel kpi"><span class="eyebrow">Team average</span><span class="v">${fmtH(D.avg)}<small>h</small></span><span class="small muted">per member</span></div>
      <div class="panel kpi"><span class="eyebrow">Not assigned</span><span class="v">${fmtH(D.unassigned)}<small>h</small></span><span class="small muted">${D.unassigned?`<a href="#board" data-filterlink="none">Assign on the board</a>`:"Everything has an owner"}</span></div>
    </div>
    ${over.length?`<div class="notice bad">${I.warn}<div><b>${over.map(r=>esc(r.m.short)).join(", ")} ${over.length>1?"are":"is"} overloaded.</b> ${under.length?`Move a task to ${under.map(r=>esc(r.m.short)).join(" or ")}, who ${under.length>1?"have":"has"} the most free time.`:"Consider splitting a large task."}</div></div>`:""}
    <div class="panel pad chart stack" style="gap:8px">
      <div class="row" style="justify-content:space-between"><h3>Active load per member</h3>
        <div class="legend"><span><span class="swatch" style="background:var(--ok)"></span>Balanced</span><span><span class="swatch" style="background:var(--warn)"></span>Underloaded</span><span><span class="swatch" style="background:var(--bad)"></span>Overloaded</span><span><svg width="22" height="4" aria-hidden="true"><line x1="0" x2="22" y1="2" y2="2" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 3"/></svg>Team average <b class="mono">${fmtH(D.avg)} h</b></span></div></div>
      <div style="overflow-x:auto"><div style="min-width:520px">${svg}</div></div>
    </div>
    <div class="panel" style="overflow-x:auto">
      <table class="load">
        <thead><tr><th>Member</th><th>Role</th><th class="n">Active</th><th class="n">Done</th><th class="n">Tasks</th><th>Share of all hours vs plan</th><th>Status</th></tr></thead>
        <tbody>${D.rows.map(r=>{const own=S.tasks.filter(t=>t.m===r.m.id).reduce((a,t)=>a+t.h,0); const pct=Math.round(own/allH*100); const plan=r.slot?r.slot.share:0;
          return `<tr><td><span class="row" style="gap:8px">${av(r.m)}${esc(r.m.name)}</span></td><td>${r.slot?`<span class="row" style="gap:6px"><span class="swatch" style="background:${col(r.slot.color)}"></span>${esc(r.slot.name)}</span>`:"—"}</td>
          <td class="n">${fmtH(r.active)} h</td><td class="n">${fmtH(r.done)} h</td><td class="n">${r.n}</td>
          <td><div class="sharebar"><div class="b"><i style="width:${Math.min(100,pct*2)}%"></i><em style="left:${Math.min(100,plan*2)}%" title="Planned ${plan}%"></em></div><span class="mono small">${pct}% / ${plan}%</span></div></td>
          <td>${statusChip(r.status)}</td></tr>`;}).join("")}</tbody>
      </table>
    </div>
    <p class="small muted">Share bar: grey fill is the member's share of all task hours, the tick is the effort share planned for their role (scale 0–50%).</p>
  </div>`);
}

function vSettings(){
  const p=S.project;
  return shell("settings", head("Settings","Project settings","Only the owner can change these.")+`
  <div class="split">
    <form class="panel pad stack" id="setForm" novalidate>
      <h2>Details</h2>
      <div class="field"><label for="sTitle">Title</label><input class="input" id="sTitle" value="${esc(p.title)}"></div>
      <div class="field"><label for="sDesc">Description</label><textarea class="textarea" id="sDesc" style="min-height:140px">${esc(p.description)}</textarea>
        <span class="hint">Changing the description or team size asks whether to regenerate the role plan.</span></div>
      <div class="grid2"><div class="field"><label for="sDl">Deadline</label><input class="input" id="sDl" type="date" value="${p.deadline}"></div>
        <div class="field"><label for="sCtx">Course or context</label><input class="input" id="sCtx" value="${esc(p.context)}"></div></div>
      <div><button class="btn primary" type="submit">Save details</button></div>
    </form>
    <div class="stack">
      <div class="panel pad stack" style="gap:10px"><h3>Invite code</h3>
        <div class="invite"><span class="code">${p.code}</span><button class="btn sm" type="button" data-copy="${p.code}">${I.copy}Copy</button></div>
        <div><button class="btn sm" type="button" data-act="newcode">${I.refresh}Make a new code</button></div>
        <p class="small muted">The old code stops working right away.</p></div>
      <div class="panel pad stack" style="gap:4px"><div class="row" style="justify-content:space-between"><h3>Members</h3><span class="mono small muted">${S.members.length} / ${p.teamSize}</span></div>
        ${S.members.map(m=>`<div class="memberrow">${av(m)}<div class="nm"><b class="small">${esc(m.name)}</b><div class="small muted">${m.owner?"Owner · ":""}${esc((assignedSlotOf(m.id)||{}).name||"No role yet")}</div></div>
          ${m.owner?"":`<span data-rm-wrap="${m.id}"><button class="btn sm ghost" type="button" data-askrm="${m.id}">Remove</button></span>`}</div>`).join("")}
      </div>
    </div>
  </div>`);
}

/* ---------- modals ---------- */
function openLoading(title,steps,done){
  const L=$("#layer");
  L.innerHTML=`<div class="overlay"><div class="loading" role="status" aria-live="polite"><div class="spin"></div><h3>${title}</h3><ul class="steps">${steps.map((s,i)=>`<li data-i="${i}">${I.check}<span>${s}</span></li>`).join("")}</ul><span class="small muted">Simulated AI call</span></div></div>`;
  steps.forEach((_,i)=>setTimeout(()=>{const li=L.querySelector(`[data-i="${i}"]`); if(li) li.classList.add("done");}, 350*(i+1)));
  setTimeout(()=>{ L.innerHTML=""; done(); }, 350*steps.length+450);
}
function taskModal(t){
  const isNew=!t; t=t||{id:"t"+Date.now(),title:"",m:null,h:2,st:"todo"};
  const L=$("#layer");
  L.innerHTML=`<div class="overlay" data-close="1"><form class="modal" id="taskForm" role="dialog" aria-modal="true" aria-labelledby="tmH">
    <h2 id="tmH">${isNew?"New task":"Edit task"}</h2>
    <div class="field"><label for="tTitle">Title</label><input class="input" id="tTitle" value="${esc(t.title)}" required></div>
    <div class="grid2">
      <div class="field"><label for="tWho">Assignee</label><select class="select" id="tWho"><option value="">Unassigned</option>${S.members.map(m=>`<option value="${m.id}" ${t.m===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="tH">Estimate (hours)</label><input class="input mono" id="tH" type="number" min="0.5" max="40" step="0.5" value="${t.h}"></div>
    </div>
    <div class="field"><label for="tSt">Status</label><select class="select" id="tSt">${[["todo","To do"],["doing","Doing"],["done","Done"]].map(([k,l])=>`<option value="${k}" ${t.st===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="tAct">RACI activity <span class="muted" style="font-weight:400">(optional)</span></label><select class="select" id="tAct"><option value="">None</option>${S.raci.acts.map(a=>`<option ${t.a===a.id?"selected":""} value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div>
    <p class="small" id="tErr" style="color:var(--bad)" hidden></p>
    <div class="row" style="justify-content:space-between"><div class="row"><button class="btn primary" type="submit">${isNew?"Add task":"Save"}</button><button class="btn" type="button" data-close="1">Cancel</button></div>
      ${isNew?"":`<button class="btn danger sm" type="button" data-deltask="${t.id}">Delete</button>`}</div>
  </form></div>`;
  $("#tTitle").focus();
  $("#taskForm").addEventListener("submit",e=>{
    e.preventDefault();
    const title=$("#tTitle").value.trim(), h=parseFloat($("#tH").value);
    if(!title){ $("#tErr").textContent="Give the task a title."; $("#tErr").hidden=false; return; }
    if(!(h>=0.5&&h<=40)){ $("#tErr").textContent="Estimate must be between 0.5 and 40 hours."; $("#tErr").hidden=false; return; }
    const obj={...t,title,h:Math.round(h*2)/2,m:$("#tWho").value||null,st:$("#tSt").value,a:$("#tAct").value||null};
    if(isNew) S.tasks.push(obj); else S.tasks[S.tasks.findIndex(x=>x.id===t.id)]=obj;
    L.innerHTML=""; render(); toast(isNew?"Task added":"Task saved");
  });
}

/* ---------- render ---------- */
function render(){
  const k=current(); if(k==="login") AUTH=false;
  const map={login:vLogin,projects:vProjects,new:vNew,join:vJoin,profile:vProfile,plan:vPlan,roles:vRoles,raci:vRaci,board:vBoard,dashboard:vDash,settings:vSettings};
  $("#app").innerHTML=map[k]();
  bind(k);
}

/* ---------- events ---------- */
function bind(k){
  const app=$("#app");
  if(k==="login"){
    app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.authTab=b.dataset.tab; render();}));
    $("#authForm").addEventListener("submit",e=>{e.preventDefault();
      if(S.authTab==="register" && !$("#fConsent").checked){ $("#consentErr").hidden=false; return; }
      AUTH=true; const h=(location.hash||"").replace("#",""); if(!h||h==="login"){ location.hash="projects"; } else render(); window.scrollTo(0,0); toast(S.authTab==="register"?"Account created":"Logged in");});
  }
  if(k==="new"){
    const f=S.draft;
    $("#nDesc").addEventListener("input",e=>{f.description=e.target.value; const c=$("#nCount"); c.textContent=`${f.description.length} / 3000 · min 100`; c.classList.toggle("bad",f.description.length<100);});
    $("#nTitle").addEventListener("input",e=>f.title=e.target.value);
    $("#nDeadline").addEventListener("change",e=>f.deadline=e.target.value);
    $("#nCtx").addEventListener("input",e=>f.context=e.target.value);
    app.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{f.size=Math.min(6,Math.max(3,f.size+Number(b.dataset.step))); render();}));
    $("#newForm").addEventListener("submit",e=>{e.preventDefault();
      const err=$("#newErr"); const dl=new Date(f.deadline+"T00:00:00"); const minD=new Date(TODAY); minD.setDate(minD.getDate()+7);
      if(!f.title.trim()){err.textContent="Add a project title."; err.hidden=false; return;}
      if(f.description.trim().length<100){err.textContent="The description needs at least 100 characters so the AI can understand the project."; err.hidden=false; return;}
      if(!f.deadline||dl<minD){err.textContent="Set a deadline at least 7 days from today."; err.hidden=false; return;}
      openLoading("Designing your team",["Reading the project description","Estimating work until "+fmtDate(f.deadline),`Choosing ${f.size} roles`,"Writing responsibilities and skills"],()=>{
        S.project.planStatus="draft"; go("plan"); toast(f.size===5?"Role plan ready: review and approve it":"Prototype shows the 5-role sample plan");});
    });
  }
  if(k==="join"){ app.querySelector('[data-act="join"]').addEventListener("click",()=>{go("profile"); toast("You joined StudySpace. Fill in your profile next.");}); }
  if(k==="profile"){
    const m=mem(S.user);
    app.querySelectorAll("[data-count]").forEach(c=>{const ta=$("#"+c.dataset.count); ta.addEventListener("input",()=>{c.textContent=`${ta.value.length} / 1000`; c.classList.toggle("bad",ta.value.length<Number(c.dataset.min));});});
    $("#profForm").addEventListener("submit",e=>{e.preventDefault(); const s=$("#pStr").value.trim(), w=$("#pWeak").value.trim();
      if(s.length<30||w.length<10){ toast("Strengths need 30+ characters, weaknesses 10+"); return; }
      m.strengths=s; m.weaknesses=w; toast("Profile saved. Your AI suggestion is marked as outdated.");});
    app.querySelector('[data-act="askdel"]').addEventListener("click",()=>{
      $("#dzBody").innerHTML=`<div class="stack" style="gap:8px"><p class="small"><b>This can't be undone.</b> Ownership of StudySpace passes to Daniyar.</p><div class="row"><button class="btn danger sm" type="button" id="dzYes">Yes, delete my profile</button><button class="btn sm" type="button" id="dzNo">Keep it</button></div></div>`;
      $("#dzYes").addEventListener("click",()=>{ toast("Prototype: profile would be deleted"); render(); });
      $("#dzNo").addEventListener("click",render);
    });
  }
  if(k==="plan"){
    app.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener("click",()=>{S.planEdit=true; S._backup=JSON.stringify(S.slots); render();}));
    app.querySelectorAll('[data-act="canceledit"]').forEach(b=>b.addEventListener("click",()=>{S.planEdit=false; S.slots=JSON.parse(S._backup); render();}));
    app.querySelectorAll('[data-act="saveplan"]').forEach(b=>b.addEventListener("click",()=>{
      app.querySelectorAll("[data-slotfield]").forEach(el=>{ slot(el.dataset.id)[el.dataset.slotfield]=el.textContent.trim(); });
      S.planEdit=false; render(); toast("Role plan saved");}));
    app.querySelectorAll("[data-share]").forEach(inp=>inp.addEventListener("change",()=>{
      app.querySelectorAll("[data-slotfield]").forEach(el=>{ slot(el.dataset.id)[el.dataset.slotfield]=el.textContent.trim(); });
      slot(inp.dataset.share).share=Math.max(0,Math.round(Number(inp.value)||0)); render();}));
    app.querySelectorAll('[data-act="approve"]').forEach(b=>b.addEventListener("click",()=>{S.project.planStatus="approved"; render(); toast("Plan approved. Matching is now available.");}));
    app.querySelectorAll('[data-act="regen"]').forEach(b=>b.addEventListener("click",()=>{
      const note=($("#regenNote")||{}).value||"";
      openLoading("Redesigning roles",[note?"Reading your note":"Re-reading the description","Balancing effort across "+S.slots.length+" seats","Writing new rationales"],()=>{S.project.planStatus="draft"; render(); toast("New draft ready. Review it, then approve.");});
    }));
  }
  if(k==="roles"){
    app.querySelectorAll('[data-act="runmatch"]').forEach(b=>b.addEventListener("click",()=>{
      openLoading("Matching people to roles",["Reading 5 profiles","Scoring every person for every role","Finding the best fit for the whole team","Writing explanations"],()=>{
        const fresh=seed().matching; S.matching=fresh; render(); toast("Matching done. Review and accept.");});
    }));
    app.querySelectorAll('[data-act="acceptall"]').forEach(b=>b.addEventListener("click",()=>{S.matching.rows.forEach(r=>{ if(r.state!=="accepted"){r.state="accepted"; r.source=r.source==="manual"?"manual":"ai_accepted";}}); render(); toast("All roles confirmed");}));
    app.querySelectorAll("[data-accept]").forEach(b=>b.addEventListener("click",()=>{const r=S.matching.rows.find(r=>r.slot===b.dataset.accept); r.state="accepted"; if(r.source!=="manual") r.source="ai_accepted"; render();}));
    app.querySelectorAll("[data-reassign]").forEach(sel=>sel.addEventListener("change",()=>{
      const r=S.matching.rows.find(r=>r.slot===sel.dataset.reassign), other=S.matching.rows.find(x=>x.member===sel.value);
      if(other&&other!==r){ other.member=r.member; other.source="manual"; other.state="accepted"; }
      r.member=sel.value; r.source="manual"; r.state="accepted"; render(); toast("Roles swapped and saved as manual");}));
  }
  if(k==="raci"){
    const order=["","R","A","C","I"];
    app.querySelectorAll("[data-cell]").forEach(b=>b.addEventListener("click",()=>{const [a,s]=b.dataset.cell.split("|"); const act=S.raci.acts.find(x=>x.id===a);
      const v=act.v[s]||""; act.v[s]=order[(order.indexOf(v)+1)%order.length]; render(); const nb=$(`[data-cell="${a}|${s}"]`); if(nb) nb.focus();}));
    app.querySelector('[data-act="addact"]').addEventListener("click",()=>{S.raci.acts.push({id:"a"+Date.now(),name:"New activity",v:{}}); render(); toast("Activity added. Set one A and at least one R.");});
    app.querySelector('[data-act="regenraci"]').addEventListener("click",()=>openLoading("Drafting RACI",["Reading project and roles","Ordering activities to the deadline","Checking one A per activity"],()=>{S.raci=seed().raci; render(); toast("RACI draft regenerated");}));
  }
  if(k==="board"){
    app.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.filter; render();}));
    app.querySelectorAll('[data-act="addtask"]').forEach(b=>b.addEventListener("click",()=>taskModal(null)));
    app.querySelectorAll("[data-task]").forEach(c=>{
      c.addEventListener("click",()=>taskModal(S.tasks.find(t=>t.id===c.dataset.task)));
      c.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",c.dataset.task); c.classList.add("dragging");});
      c.addEventListener("dragend",()=>c.classList.remove("dragging"));
    });
    app.querySelectorAll("[data-col]").forEach(cl=>{
      cl.addEventListener("dragover",e=>{e.preventDefault(); cl.classList.add("over");});
      cl.addEventListener("dragleave",()=>cl.classList.remove("over"));
      cl.addEventListener("drop",e=>{e.preventDefault(); cl.classList.remove("over"); const id=e.dataTransfer.getData("text/plain"); const t=S.tasks.find(t=>t.id===id); if(t&&t.st!==cl.dataset.col){ t.st=cl.dataset.col; render(); toast(`Moved to ${({todo:"To do",doing:"Doing",done:"Done"})[t.st]}`);}});
    });
  }
  if(k==="dashboard"){ app.querySelectorAll("[data-filterlink]").forEach(a=>a.addEventListener("click",()=>{S.filter=a.dataset.filterlink;})); }
  if(k==="settings"){
    $("#setForm").addEventListener("submit",e=>{e.preventDefault(); const p=S.project; const nd=$("#sDesc").value.trim(); const changed=nd!==p.description;
      p.title=$("#sTitle").value.trim()||p.title; p.description=nd; p.deadline=$("#sDl").value||p.deadline; p.context=$("#sCtx").value.trim(); render();
      toast(changed?"Saved. The description changed: regenerate the role plan?":"Details saved");});
    app.querySelector('[data-act="newcode"]').addEventListener("click",()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; S.project.code=Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join(""); render(); toast("New code: "+S.project.code);});
    app.querySelectorAll("[data-askrm]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.askrm, m=mem(id), w=app.querySelector(`[data-rm-wrap="${id}"]`);
      w.innerHTML=`<span class="row" style="gap:6px"><span class="small">Remove ${esc(m.short)}?</span><button class="btn danger sm" type="button" data-rmyes>Remove</button><button class="btn sm" type="button" data-rmno>Keep</button></span>`;
      w.querySelector("[data-rmno]").addEventListener("click",render);
      w.querySelector("[data-rmyes]").addEventListener("click",()=>{toast(`Prototype: ${m.short} would be removed and their tasks unassigned`); render();});
    }));
  }
  app.querySelectorAll("[data-logout]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault(); AUTH=false; S.authTab="login"; if(location.hash==="#login") render(); else location.hash="login";}));
  app.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.copy)));
}
$("#layer").addEventListener("click",e=>{
  if(e.target.dataset.close){ $("#layer").innerHTML=""; }
  const d=e.target.closest("[data-deltask]"); if(d){ S.tasks=S.tasks.filter(t=>t.id!==d.dataset.deltask); $("#layer").innerHTML=""; render(); toast("Task deleted"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#layer").innerHTML && !$(".loading")) $("#layer").innerHTML=""; });

render();
})();
</script>
