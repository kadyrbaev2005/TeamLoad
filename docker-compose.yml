services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamload
      POSTGRES_PASSWORD: teamload
      POSTGRES_DB: teamload
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamload"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://teamload:teamload@db:5432/teamload?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  pgdata:
