version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # int conversions are bounded by validation
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
